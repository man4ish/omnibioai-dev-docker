name: Docker Environment CI

on:
  push:
    branches: ["main", "develop", "feature/*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  # ── Job 1: Validate configuration files ─────────────────────────────────────
  validate-config:
    name: Validate Docker Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run configuration tests
        run: |
          pytest tests/ \
            --cov=tests \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ── Job 2: Lint Dockerfile ───────────────────────────────────────────────────
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009,DL3015
          # DL3008 — pin apt versions (too strict for dev env)
          # DL3009 — delete apt lists (already doing this)
          # DL3015 — avoid additional packages (needed for dev)
          failure-threshold: error

  # ── Job 3: Validate requirements.txt ────────────────────────────────────────
  validate-requirements:
    name: Validate requirements.txt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check requirements.txt is parseable
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          req = Path("requirements.txt")
          assert req.exists(), "requirements.txt not found"

          names = []
          errors = []
          for i, line in enumerate(req.read_text().splitlines(), start=1):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name = re.split(r"[>=<!@\s]", line)[0].strip().lower()
              if not name:
                  errors.append(f"Line {i}: empty package name")
              else:
                  names.append(name)

          duplicates = [n for n in set(names) if names.count(n) > 1]
          if duplicates:
              errors.append(f"Duplicate packages: {duplicates}")

          if errors:
              for e in errors:
                  print(f"❌ {e}")
              exit(1)

          print(f"✅ requirements.txt valid — {len(names)} packages")
          PYEOF

      - name: Check key packages present
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path

          content = Path("requirements.txt").read_text().lower()
          required = [
              "torch", "transformers", "jupyterlab",
              "pandas", "numpy", "scikit", "xgboost",
          ]
          missing = [p for p in required if p not in content]
          if missing:
              print(f"❌ Missing packages: {missing}")
              exit(1)
          print(f"✅ All key packages present")
          PYEOF

  # ── Job 4: Security scan ─────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Dockerfile for secrets
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          content = Path("Dockerfile").read_text()
          patterns = [
              (r'hf_[A-Za-z]{20,}', "HuggingFace API key"),
              (r'sk-[A-Za-z0-9]{20,}', "OpenAI API key"),
              (r'PASSWORD\s*=\s*["\'][^"\']{4,}["\']', "Hardcoded password"),
              (r'SECRET\s*=\s*["\'][^"\']{4,}["\']', "Hardcoded secret"),
          ]
          found = []
          for pattern, label in patterns:
              if re.search(pattern, content, re.IGNORECASE):
                  found.append(label)
          if found:
              print(f"❌ Secrets found: {found}")
              exit(1)
          print("✅ No secrets found in Dockerfile")
          PYEOF

      - name: Scan run script for secrets
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          content = Path("run_ai_dev.sh").read_text()
          patterns = [
              (r'hf_[A-Za-z]{20,}', "HuggingFace API key"),
              (r'PASSWORD\s*=\s*[^\$][^\s]{4,}', "Hardcoded password"),
          ]
          found = []
          for pattern, label in patterns:
              if re.search(pattern, content, re.IGNORECASE):
                  found.append(label)
          if found:
              print(f"❌ Secrets found in run script: {found}")
              exit(1)
          print("✅ No secrets found in run script")
          PYEOF

  # ── Job 5: Build validation (dry run) ────────────────────────────────────────
  validate-build:
    name: Validate Dockerfile Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Dockerfile syntax
        run: |
          # Use docker build --check (dry run) to validate syntax without building
          # Falls back to basic parsing if --check not supported
          if docker build --help | grep -q "\-\-check"; then
            docker build --check . && echo "✅ Dockerfile syntax valid"
          else
            echo "Docker --check not supported, validating structure manually"
            python3 - << 'PYEOF'
          from pathlib import Path
          content = Path("Dockerfile").read_text()
          required = ["FROM ", "WORKDIR ", "RUN ", "EXPOSE ", "CMD "]
          missing = [r for r in required if r not in content]
          if missing:
              print(f"❌ Missing instructions: {missing}")
              exit(1)
          print("✅ Dockerfile structure valid")
          PYEOF
          fi

  # ── Job 6: Environment summary ───────────────────────────────────────────────
  environment-summary:
    name: Environment Summary
    runs-on: ubuntu-latest
    needs: [validate-config, lint-dockerfile, validate-requirements, security-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate environment summary
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          dockerfile = Path("Dockerfile").read_text()
          requirements = Path("requirements.txt").read_text()

          # Extract base image
          from_match = re.search(r'^FROM\s+(\S+)', dockerfile, re.MULTILINE)
          base_image = from_match.group(1) if from_match else "unknown"

          # Extract version label
          version_match = re.search(r'LABEL version="([^"]+)"', dockerfile)
          version = version_match.group(1) if version_match else "unknown"

          # Count packages
          req_count = sum(
              1 for line in requirements.splitlines()
              if line.strip() and not line.startswith("#")
          )

          # Extract exposed ports
          ports = re.findall(r'^EXPOSE\s+(\d+)', dockerfile, re.MULTILINE)

          print(f"\n{'='*60}")
          print(f"  OmniBioAI Dev Docker Environment Summary")
          print(f"{'='*60}")
          print(f"  Version:      {version}")
          print(f"  Base image:   {base_image}")
          print(f"  Exposed ports: {', '.join(ports)}")
          print(f"  Python packages: {req_count}")
          print(f"\n  Included tools:")
          tools = {
              "JupyterLab": "jupyterlab" in dockerfile.lower(),
              "Ollama": "ollama" in dockerfile.lower(),
              "Nextflow": "nextflow" in dockerfile.lower(),
              "GATK": "gatk" in dockerfile.lower(),
              "FastQC": "fastqc" in dockerfile.lower(),
              "SAMtools": "samtools" in dockerfile,
              "BCFtools": "bcftools" in dockerfile,
              "SnpEff": "snpEff" in dockerfile,
              "R + Bioconductor": "BiocManager" in dockerfile,
              "MySQL": "mysql" in dockerfile.lower(),
          }
          for tool, present in tools.items():
              status = "✅" if present else "❌"
              print(f"    {status} {tool}")
          print(f"{'='*60}\n")
          PYEOF

      - name: All checks passed
        run: |
          echo "✅ Dockerfile validation passed"
          echo "✅ Requirements valid"
          echo "✅ No secrets detected"
          echo "✅ Test coverage ≥ 95%"
          echo "✅ Ready for build"