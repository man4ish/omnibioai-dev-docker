name: CI/CD — OmniBioAI Dev Docker

on:
  push:
    branches: [main, dev, "release/**", "feature/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: omnibioai-dev-env
  REGISTRY: ghcr.io
  FULL_IMAGE: ghcr.io/${{ github.repository_owner }}/omnibioai-dev-env

jobs:
  # -----------------------------------------------------------------------
  # 1. Lint — fast, no Docker needed
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009,DL4006,DL3013,DL3042,DL4001
          failure-threshold: error

      - name: Lint run_ai_dev.sh (shellcheck)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: warning

  # -----------------------------------------------------------------------
  # 2. Unit tests — fast, no Docker needed
  # -----------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>&1

  # -----------------------------------------------------------------------
  # 3. Validate run script — no Docker needed
  # -----------------------------------------------------------------------
  validate-script:
    name: Validate run script
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Check shebang
        run: |
          head -1 run_ai_dev.sh | grep -q '^#!/bin/bash' || \
            (echo "Missing #!/bin/bash shebang" && exit 1)
          echo "✅ Shebang OK"

      - name: Syntax check
        run: bash -n run_ai_dev.sh && echo "✅ Syntax OK"

      - name: Confirm required docker flags
        run: |
          grep -q -- '--gpus all'       run_ai_dev.sh || (echo "❌ Missing --gpus all"   && exit 1)
          grep -q -- '--ipc=host'       run_ai_dev.sh || (echo "❌ Missing --ipc=host"   && exit 1)
          grep -q -- 'huggingface'      run_ai_dev.sh || (echo "❌ Missing HF mount"     && exit 1)
          grep -q -- '.ollama'          run_ai_dev.sh || (echo "❌ Missing Ollama mount" && exit 1)
          grep -q -- 'nvidia-smi'       run_ai_dev.sh || (echo "❌ Missing GPU guard"    && exit 1)
          grep -q -- 'JUPYTER_PORT'     run_ai_dev.sh || (echo "❌ Missing JUPYTER_PORT" && exit 1)
          grep -q -- 'OLLAMA_PORT'      run_ai_dev.sh || (echo "❌ Missing OLLAMA_PORT"  && exit 1)
          grep -q -- 'ghcr.io/man4ish' run_ai_dev.sh || (echo "❌ Missing GHCR image"   && exit 1)
          echo "✅ All required flags present"

  # -----------------------------------------------------------------------
  # 4. Validate Dockerfile structure — no Docker build needed
  # -----------------------------------------------------------------------
  validate-dockerfile:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Check required instructions
        run: |
          grep -q 'nvcr.io/nvidia/pytorch' Dockerfile || (echo "❌ Wrong base image" && exit 1)
          grep -q 'EXPOSE 8888'            Dockerfile || (echo "❌ Missing port 8888" && exit 1)
          grep -q 'EXPOSE 11434'           Dockerfile || (echo "❌ Missing port 11434" && exit 1)
          grep -q 'openjdk-17'             Dockerfile || (echo "❌ Missing Java 17" && exit 1)
          grep -q 'gatk'                   Dockerfile || (echo "❌ Missing GATK" && exit 1)
          grep -q 'nextflow'               Dockerfile || (echo "❌ Missing Nextflow" && exit 1)
          grep -q 'All tools validated'    Dockerfile || (echo "❌ Missing validation step" && exit 1)
          grep -q 'org.opencontainers'     Dockerfile || (echo "❌ Missing OCI labels" && exit 1)
          ! grep -q 'mysql-server'         Dockerfile || (echo "❌ mysql-server should not be in image" && exit 1)
          ! grep -q 'openjdk-11'           Dockerfile || (echo "❌ Java 11 should be Java 17" && exit 1)
          echo "✅ Dockerfile structure OK"

      - name: Check requirements.txt has no DGX file:// installs
        run: |
          count=$(grep -c "file://" requirements.txt || true)
          if [ "$count" -gt 0 ]; then
            echo "❌ Found $count file:// installs in requirements.txt"
            grep "file://" requirements.txt
            exit 1
          fi
          echo "✅ No DGX-specific file:// installs in requirements.txt"

      - name: Check requirements.dgx.txt exists
        run: |
          test -f requirements.dgx.txt || (echo "❌ requirements.dgx.txt missing" && exit 1)
          echo "✅ requirements.dgx.txt exists"

  # -----------------------------------------------------------------------
  # 5. Push to GHCR — DGX self-hosted runner (has GPU + disk space)
  # -----------------------------------------------------------------------
  push:
    name: Push to GHCR
    runs-on: [self-hosted, gpu]       # ← DGX runner needed for nvcr.io base
    needs: [test, validate-script, validate-dockerfile]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Validate pushed image
        run: |
          docker run --rm --gpus all \
            ${{ env.FULL_IMAGE }}:latest \
            bash -c "
              python -c 'import torch; print(f\"PyTorch {torch.__version__}\")'
              nextflow -version
              gatk --version
              samtools --version | head -1
              fastqc --version
              echo '✅ All tools validated'
            "

      - name: Image size report
        run: |
          docker inspect ${{ env.FULL_IMAGE }}:latest \
            --format='Image size: {{.Size}}' | \
            awk '{printf "%s %.1f GB\n", $1" "$2, $3/1073741824}'

      - name: Summary
        run: |
          echo "### ✅ Pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Pull: \`docker pull ${{ env.FULL_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY